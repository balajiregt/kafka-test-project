<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Kafka admin versus Kafka listener</title>
  <desc id="desc">Animated visual contrasting Kafka admin topic management with Kafka listener record consumption.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .admin { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .listener { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; rx: 14; }
      .broker { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 16; }
      .topic { fill: #ffffff; stroke: #818cf8; stroke-width: 1.5; rx: 8; }
      .label { font-family: Arial, sans-serif; fill: #0f172a; font-size: 18px; font-weight: 700; }
      .small { font-family: Arial, sans-serif; fill: #334155; font-size: 13px; }
      .tiny { font-family: Arial, sans-serif; fill: #475569; font-size: 12px; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .admin-arrow { stroke: #c2410c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 5; }
      .record { fill: #0e7490; stroke: #164e63; stroke-width: 1; }
      .gear { fill: #fb923c; stroke: #9a3412; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="340"/>

  <rect class="admin" x="40" y="55" width="230" height="100"/>
  <text class="label" x="92" y="90">Kafka Admin</text>
  <text class="small" x="72" y="118">creates/describes topics</text>
  <text class="tiny" x="72" y="140">NewTopic + KafkaAdmin</text>

  <rect class="listener" x="40" y="205" width="230" height="100"/>
  <text class="label" x="88" y="240">Kafka Listener</text>
  <text class="small" x="74" y="268">consumes records</text>
  <text class="tiny" x="74" y="290">@KafkaListener method</text>

  <rect class="broker" x="380" y="75" width="260" height="190"/>
  <text class="label" x="452" y="110">Broker</text>
  <rect class="topic" x="415" y="145" width="190" height="38"/>
  <text class="small" x="438" y="170">identity.events.v1</text>
  <rect class="topic" x="415" y="197" width="190" height="38"/>
  <text class="small" x="454" y="222">partitions</text>

  <rect class="box" x="735" y="205" width="180" height="100"/>
  <text class="label" x="778" y="240">App Logic</text>
  <text class="small" x="768" y="268">track + project event</text>

  <path class="admin-arrow" d="M270 105 H380"/>
  <path class="arrow" d="M640 235 H735"/>
  <path class="arrow" d="M380 235 H270"/>

  <circle class="gear" r="11">
    <animateMotion dur="3.8s" repeatCount="indefinite" path="M150 105 H380"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.72;1" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle class="record" r="10">
    <animateMotion dur="4.2s" begin="1s" repeatCount="indefinite" path="M510 217 H270 M270 217 H150"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="4.2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle class="record" r="10">
    <animateMotion dur="4.2s" begin="2s" repeatCount="indefinite" path="M510 217 H735"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.82;1" dur="4.2s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <text class="tiny" x="365" y="315">Admin prepares Kafka resources. Listener processes business records after they arrive.</text>
</svg>
